<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchday — Football Tournament Manager</title>
<style>
:root{
  --bg:#0a110e;--bg2:#0f1a15;--surface:#131f19;--surface2:#1a2a22;--line:#27392f;--text:#e9f2ed;--muted:#8da699;
  --accent:#3ddc84;--accent-ink:#04210f;--gold:#f2c14e;--danger:#ef5b5b;--warn:#f0a63a;--info:#5aa9ff;
  --shadow:0 8px 30px rgba(0,0,0,.35);--stripe:rgba(255,255,255,.025);
}
[data-theme=light]{
  --bg:#eef3f0;--bg2:#e4ece7;--surface:#ffffff;--surface2:#f3f7f4;--line:#d5dfd9;--text:#13231b;--muted:#5b7165;
  --accent:#12a150;--accent-ink:#fff;--gold:#b7860b;--danger:#d63c3c;--warn:#c47a0a;--info:#2a6fd1;
  --shadow:0 8px 24px rgba(20,50,35,.12);--stripe:rgba(0,60,30,.035);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
h2{font-size:18px;letter-spacing:.2px}
h3{font-size:15px}
.num,td.n,.tabnum{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:
  repeating-linear-gradient(90deg,var(--stripe) 0 48px,transparent 48px 96px),var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:800;font-size:17px;letter-spacing:.3px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.brand .ball{font-size:20px}
.spacer{flex:1}
.top select{max-width:240px}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:53px;z-index:19}
.tab{background:none;border:0;padding:11px 14px;color:var(--muted);cursor:pointer;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .badge{margin-left:6px}
main{max-width:1240px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card>h2,.card>h3{margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.bold{font-weight:700}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.icon{padding:3px 7px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea,input:not([type]){background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=color]{width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
textarea{resize:vertical;min-height:90px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.fld.chk{flex-direction:row;align-items:center;gap:8px;padding-top:18px}
.fld.chk>span{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fields.w2{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.chip.info{color:var(--info)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--gold)))}
.crest{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;letter-spacing:.2px;flex:none;border:2px solid rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.crest.lg{width:44px;height:44px;font-size:13px}
.crest.sm{width:20px;height:20px;font-size:7px;border-width:1px}
.tm{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tm span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.tbd .nm{color:var(--muted);font-style:italic}
/* tables */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:7px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);text-align:center;font-variant-numeric:tabular-nums}
.tbl th.l,.tbl td.l{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface2)}
.tbl td.pts{font-weight:800}
.tbl td.pos{width:34px;color:var(--muted);border-left:4px solid transparent}
.tbl input{padding:4px 6px}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.form .W{background:#1ea35a}.form .D{background:#7b8b83}.form .L{background:#d24a4a}
.zones{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.zones i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* matches */
.rnd{padding:9px 14px;background:var(--surface2);font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.rnd:first-child{border-top:0}
.match{display:grid;grid-template-columns:96px 1fr 128px 1fr 74px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.match:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.match .dt{font-size:12px;color:var(--muted);line-height:1.25}
.match .h{justify-content:flex-end;text-align:right}
.match .sc{width:46px;text-align:center;padding:6px 2px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.match .mid{display:flex;gap:6px;align-items:center;justify-content:center}
.match .mid .dash{color:var(--muted)}
.match .acts{display:flex;gap:4px;justify-content:flex-end}
.match.played .sc{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.mtags{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);grid-column:2/5;justify-content:center;margin-top:-4px}
.tag{padding:0 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,var(--line))}
.tag.warn{color:var(--warn)}
/* bracket */
.bwrap{overflow:auto;padding:10px 4px 20px}
.bracket{display:flex;min-width:max-content;align-items:stretch}
.bcol{display:flex;flex-direction:column;width:250px;flex:none}
.bcol h4{text-align:center;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:0 0 10px;height:24px}
.bslots{display:flex;flex-direction:column;flex:1}
.slot{flex:1;position:relative;display:flex;align-items:center;padding:6px 22px 6px 22px;min-height:84px}
.bcol.first .slot{padding-left:0}
.bcol.last .slot{padding-right:0}
.slot.nx::after{content:"";position:absolute;right:0;top:50%;width:22px;border-top:2px solid var(--line)}
.slot.nx.up::before{content:"";position:absolute;right:0;top:50%;height:50%;border-right:2px solid var(--line)}
.slot.nx.dn::before{content:"";position:absolute;right:0;bottom:50%;height:50%;border-right:2px solid var(--line)}
.slot.pv .tie::before{content:"";position:absolute;left:-22px;top:50%;width:22px;border-top:2px solid var(--line)}
.tie{position:relative;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;overflow:visible;box-shadow:var(--shadow)}
.tie:hover{border-color:var(--accent)}
.tie .side{display:flex;align-items:center;gap:8px;padding:6px 9px;min-height:32px}
.tie .side+.side{border-top:1px solid var(--line)}
.tie .side .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tie .side.w .nm{font-weight:800}
.tie .side.w{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tie .side.l .nm{color:var(--muted)}
.tie .side .lg{font-size:11px;color:var(--muted);display:flex;gap:6px}
.tie .side .tot{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tie .foot{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 6px;border-top:1px dashed var(--line);background:var(--surface2);border-radius:0 0 9px 9px}
.tie.tbd{opacity:.8}
.champ{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:14px;padding:18px 22px;margin-bottom:16px}
.champ .trophy{font-size:44px}
.champ h2{font-size:22px}
/* misc */
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}
.callout{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.callout.error{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));color:var(--danger)}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.callout.info{color:var(--muted)}
.callout.ok{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.callout b{color:var(--text)}
.stage{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;background:var(--surface)}
.stage>.sh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border-radius:13px 13px 0 0;flex-wrap:wrap}
.stage>.sh .idx{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.stage>.sh input.name{font-weight:700;max-width:260px}
.stage>.sb{padding:14px;display:grid;gap:14px}
.sec{border-top:1px dashed var(--line);padding-top:12px}
.sec>h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.srcrow,.zrow,.tbrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.srcrow>*{width:auto}
.srcrow select,.srcrow input{width:auto;min-width:80px}
.srcrow input[type=number]{width:70px}
.zrow input[type=number]{width:64px}
.zrow input[type=text]{width:190px}
.tbrow{padding:4px 8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;width:max-content;max-width:100%}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.pcard:hover{border-color:var(--accent)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pcard .ic{font-size:22px}
.pcard b{font-size:13.5px}
.pcard small{color:var(--muted);line-height:1.35}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.tcard{display:flex;flex-direction:column;gap:8px}
.tcard h3{font-size:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:820px;box-shadow:var(--shadow)}
.modal.sm{max-width:480px}
.modal.lg{max-width:1000px}
.modal>.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>.mh h3{flex:1;font-size:16px}
.modal>.mb2{padding:16px 18px}
.modal>.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mm-sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.mm-score{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.mm-score input{width:64px;text-align:center;font-size:22px;font-weight:800;padding:8px 4px}
.mm-score .tm{font-weight:700;font-size:15px}
.evrow{display:grid;grid-template-columns:130px 1fr 1fr 1fr 70px 34px;gap:6px;margin-bottom:6px;align-items:center}
.evrow input,.evrow select{padding:5px 7px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.toast.err{border-color:var(--danger)}
.kpi{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.mini:last-child{border-bottom:0}
.mini .sc{font-weight:800;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.mini .tm{flex:1}
.mini .tm:first-child{justify-content:flex-end}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
kbd{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}
.sticky-foot{position:sticky;bottom:0}
@media (max-width:760px){
  main{padding:12px}.top{padding:8px 12px}.tabs{padding:0 8px;top:49px}
  .match{grid-template-columns:1fr 100px 1fr;grid-template-areas:"dt dt dt" "h mid a" "ac ac ac"}
  .match>.dt{grid-area:dt}.match>.h{grid-area:h}.match>.mid{grid-area:mid}.match>.a{grid-area:a}.match>.acts{grid-area:ac;justify-content:center}
  .mtags{grid-column:1/-1}
  .evrow{grid-template-columns:1fr 1fr}
  .brand small{display:none}
}
@media print{
  .top,.tabs,.btn,.acts,.no-print,.toast{display:none!important}
  body{background:#fff;color:#000}.card,.stage{border-color:#bbb;background:#fff;box-shadow:none}
  :root{--text:#000;--muted:#444;--line:#ccc;--surface:#fff;--surface2:#f4f4f4;--bg:#fff}
}
.tm.rev{flex-direction:row-reverse}
.tie .side .tm{flex:1;min-width:0}
.match .h{display:flex;justify-content:flex-end;text-align:right;min-width:0}
.match .a{display:flex;min-width:0}
.match .tm{min-width:0}
details.card summary{outline:none}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="confirm"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   ENGINE — pure logic, no DOM. Everything the UI shows is derived here.
   ===================================================================== */
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function sameSet(a, b) { if (a.length !== b.length) return false; const s = new Set(a); return b.every(x => s.has(x)); }
function addDays(d, n) {
  if (!d) return '';
  const x = new Date(d + 'T00:00:00Z'); if (isNaN(x)) return '';
  x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10);
}
function seedOrder(size) {
  let o = [1, 2];
  while (o.length < size) { const n = o.length * 2; const nx = []; for (const s of o) nx.push(s, n + 1 - s); o = nx; }
  return o;
}
function groupName(i) { return 'Group ' + (i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(64 + Math.floor(i / 26)) + String.fromCharCode(65 + i % 26)); }
function shortOf(name) {
  const w = String(name).trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '???';
  if (w.length === 1) return w[0].slice(0, 3).toUpperCase();
  if (w.length >= 3) return w.slice(0, 3).map(x => x[0]).join('').toUpperCase();
  return (w[0][0] + w[1].slice(0, 2)).toUpperCase();
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const x = v => Math.round(v * 255).toString(16).padStart(2, '0');
  return '#' + x(f(0)) + x(f(8)) + x(f(4));
}
function colorFromName(name) {
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return hslToHex(h % 360, 55, 42);
}
const nextPow2 = n => { let p = 1; while (p < n) p *= 2; return p; };

/* ---------- constructors ---------- */
function newTeam(name, o = {}) {
  name = String(name || '').trim() || 'Team';
  return { id: uid('tm'), name, short: (o.short || shortOf(name)).slice(0, 4).toUpperCase(), color: o.color || colorFromName(name), pot: o.pot || 0, players: o.players || [] };
}

const KEY = 'matchday-manager-v1';
const S = { db: null, tab: 'overview', fx: { stage: 'all', group: 'all', round: 'cur', team: 'all', status: 'all', q: '' }, tb: { stage: null, ext: false }, bk: { stage: null }, ss: { stage: 'all' }, mm: null, modal: null, confirm: null, hist: [], wz: null, work: null };
const A = {}, CHG = {}, V = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = () => S.db.tournaments.find(t => t.id === S.db.activeId) || null;
const getStage = (t, id) => t.stages.find(s => s.id === id);
const fmtDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

/* ---------- persistence ---------- */
function load() {
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
  if (!db || !Array.isArray(db.tournaments)) {
    let light = false; try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) { }
    db = { v: 1, tournaments: [], activeId: null, theme: light ? 'light' : 'dark' };
  }
  S.db = db;
  db.tournaments.forEach(t => { try { recompute(t); } catch (e) { console.error(e); } });
  if (db.activeId && !cur()) db.activeId = null;
}
let saveTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S.db)); }
  catch (e) { toast('Could not save in this browser — use Data → Export to keep a copy.', true); }
}
function pushHist(t) { S.hist.push({ id: t.id, json: JSON.stringify(t) }); if (S.hist.length > 50) S.hist.shift(); }
function restore(entry) {
  const i = S.db.tournaments.findIndex(x => x.id === entry.id); if (i < 0) return;
  const t = JSON.parse(entry.json); S.db.tournaments[i] = t; recompute(t);
}
function mutate(fn, o = {}) {
  const t = cur(); if (!t) return;
  pushHist(t);
  try { fn(t); recompute(t); }
  catch (e) { console.error(e); const h = S.hist.pop(); if (h) restore(h); toast(e.message || 'Something went wrong', true); render(); return false; }
  t.updatedAt = Date.now(); save();
  const n = IDX(t).resets; if (n) toast(n + ' later-round result' + (n > 1 ? 's were' : ' was') + ' cleared because the teams in those fixtures changed.');
  if (!o.quiet) render();
  return true;
}
A.undo = () => {
  const t = cur(); if (!t) return;
  for (let i = S.hist.length - 1; i >= 0; i--) if (S.hist[i].id === t.id) { const [h] = S.hist.splice(i, 1); restore(h); save(); toast('Undone'); render(); return; }
  toast('Nothing to undo');
};
function toast(msg, err) {
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), err ? 4200 : 2600);
}
function ask(msg, yes, no, o = {}) { S.confirm = { msg, yes, no, label: o.label || 'Confirm', danger: o.danger !== false }; renderModal(); }
A.cfyes = () => { const c = S.confirm; S.confirm = null; renderModal(); if (c && c.yes) c.yes(); };
A.cfno = () => { const c = S.confirm; S.confirm = null; renderModal(); if (c && c.no) c.no(); };

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const ov = e.target.classList && e.target.classList.contains('ov') ? e.target : null;
  if (ov && ov.id === 'ov-main') { A.closemodal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } else console.warn('Unknown action', el.dataset.act);
});
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); mmInput(e); });
document.addEventListener('input', e => mmInput(e));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.confirm) A.cfno(); else if (S.modal) A.closemodal(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input.sc')) e.target.blur();
});

/* ---------- rendering ---------- */
function render() {
  const sy = window.scrollY;
  document.documentElement.dataset.theme = S.db.theme;
  $('app').innerHTML = view();
  renderModal();
  window.scrollTo(0, sy);
}
function renderModal() {
  const m = $('modal'), c = $('confirm');
  const prev = m.firstElementChild ? m.firstElementChild.scrollTop : 0;
  m.innerHTML = S.modal ? modalHtml() : '';
  if (m.firstElementChild && prev) m.firstElementChild.scrollTop = prev;
  c.innerHTML = S.confirm ? `<div class="ov" style="z-index:70;align-items:center"><div class="modal sm"><div class="mb2"><p style="margin:0 0 6px;font-size:15px">${esc(S.confirm.msg)}</p></div><div class="mf"><button class="btn" data-act="cfno">Cancel</button><button class="btn ${S.confirm.danger ? 'danger' : 'primary'}" data-act="cfyes">${esc(S.confirm.label)}</button></div></div></div>` : '';
}
A.closemodal = () => { S.modal = null; S.mm = null; S.work = null; S.wz = null; renderModal(); };
function openModal(m) { S.modal = m; renderModal(); }
function view() {
  const t = cur();
  let h = `<header class="top"><div class="brand" data-act="home"><span class="ball">⚽</span><span>Matchday</span><small>Tournament Manager</small></div>`;
  if (t) h += `<select data-chg="switch" title="Switch tournament">${S.db.tournaments.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;

  if (!t) return h + `<main>${homeView()}</main>`;
  const val = validate(t); const nerr = val.filter(v => v.lvl === 'error').length;
  const tabs = [['overview', 'Overview'], ['teams', 'Teams'], ['format', 'Format'], ['fixtures', 'Fixtures & Results'], ['tables', 'Tables'], ['bracket', 'Bracket'], ['stats', 'Stats'], ['data', 'Data']];
  h += `<nav class="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${l}${k === 'format' && nerr ? `<span class="badge">${nerr}</span>` : ''}</button>`).join('')}</nav>`;
  return h + `<main>${V[S.tab](t)}</main>`;
}
A.tab = el => { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); };
A.home = () => { S.db.activeId = null; save(); render(); };
A.theme = () => { S.db.theme = S.db.theme === 'dark' ? 'light' : 'dark'; save(); render(); };
CHG.switch = el => { S.db.activeId = el.value; S.tab = 'overview'; save(); render(); };
A.open = el => { S.db.activeId = el.dataset.id; S.tab = 'overview'; save(); render(); window.scrollTo(0, 0); };

/* ---------- shared view helpers ---------- */
function crest(t, id, cls = '') {
  const tm = id && teamById(t, id);
  if (!tm) return `<span class="crest ${cls}" style="background:var(--surface2);color:var(--muted)">?</span>`;
  return `<span class="crest ${cls}" style="background:${esc(tm.color)}">${esc(tm.short)}</span>`;
}
function tmCell(t, id, label, rev) {
  const tm = id && teamById(t, id);
  return `<span class="tm ${tm ? '' : 'tbd'} ${rev ? 'rev' : ''}">${crest(t, id)}<span class="nm">${esc(tm ? tm.name : (label || 'TBD'))}</span></span>`;
}
function srcLabel(t, s, tie, key) {
  const src = key === 'a' ? tie.srcA : tie.srcB;
  if (!src) return 'TBD';
  const st = s.ties.find(x => x.id === src.tie); if (!st) return 'TBD';
  return (src.as === 'w' ? 'Winner ' : 'Loser ') + roundLabel(s, st) + (st.third ? '' : ' ' + (st.idx + 1));
}
function matchSlots(s, tie, m) {
  const L = tie.matchIds.length; if (L === 1) return ['a', 'b'];
  const i = tie.matchIds.indexOf(m.id); const f = s.higherSeedSecondLeg !== false ? 'b' : 'a', o = f === 'a' ? 'b' : 'a';
  return i % 2 === 0 ? [f, o] : [o, f];
}
function roundTitle(t, s, m) {
  if (s.type === 'knockout') { const tie = s.ties.find(x => x.id === m.tieId); return tie ? roundLabel(s, tie) : 'Round ' + (m.round + 1); }
  return 'Matchday ' + (m.round + 1);
}
const statusChip = info => {
  if (info.stale) return '<span class="chip warn">⚠ Out of date</span>';
  return ({ pending: '<span class="chip">⏳ Waiting</span>', ready: '<span class="chip info">Ready to generate</span>', scheduled: '<span class="chip">Scheduled</span>', active: '<span class="chip ok">● In progress</span>', complete: '<span class="chip ok">✔ Complete</span>' })[info.status];
};
const emptyBox = (icon, title, body) => `<div class="empty"><div class="big">${icon}</div><b>${title}</b><div>${body || ''}</div></div>`;

/* ---------- home ---------- */
function homeView() {
  const L = S.db.tournaments;
  let h = `<div class="card"><div class="card-h"><div style="flex:1"><h2 style="font-size:24px">Your tournaments</h2><div class="muted">Build any football competition — leagues, cups, group stages, league phases and brackets. Fixtures, tables, brackets and stats update themselves as you enter results.</div></div><button class="btn primary" data-act="new">＋ New tournament</button><button class="btn" data-act="import">Import JSON</button></div></div>`;
  if (!L.length) {
    h += `<div class="card">${emptyBox('🏟️', 'No tournaments yet', 'Pick a preset (World Cup, Champions League, Premier League, simple knockout…) or build a custom format from scratch.')}<div class="row" style="justify-content:center"><button class="btn primary" data-act="new">＋ Create your first tournament</button></div></div>`;
    return h;
  }
  h += `<div class="grid g3">` + L.map(t => {
    const idx = IDX(t); const total = t.matches.length, played = t.matches.filter(isPlayed).length; const sm = idx.summary || {};

      <div class="row"><span class="chip">${t.teams.length} teams</span><span class="chip">${played}/${total} played</span>${sm.champion ? `<span class="chip ok">🏆 ${esc(teamName(t, sm.champion))}</span>` : ''}</div>
      <div class="progress"><i style="width:${pct(played, total)}%"></i></div>
      <div class="row"><button class="btn primary sm" data-act="open" data-id="${t.id}">Open</button><button class="btn sm" data-act="dup" data-id="${t.id}">Duplicate</button><button class="btn sm danger" data-act="del" data-id="${t.id}">Delete</button></div></div>`;
  }).join('') + `</div>`;
  return h;
}
A.dup = el => {
  const t = S.db.tournaments.find(x => x.id === el.dataset.id); if (!t) return;
  const c = JSON.parse(JSON.stringify(t)); c.id = uid('tn'); c.name = t.name + ' (copy)'; c.createdAt = Date.now(); S.db.tournaments.push(c); recompute(c); save(); render(); toast('Duplicated');
};
A.del = el => {
  const t = S.db.tournaments.find(x => x.id === el.dataset.id); if (!t) return;
  ask('Delete “' + t.name + '” permanently? Export it first if you may need it again.', () => {
    S.db.tournaments = S.db.tournaments.filter(x => x.id !== t.id); if (S.db.activeId === t.id) S.db.activeId = null; save(); render();
  }, null, { label: 'Delete', danger: true });
};
A.import = () => $('file').click();
function importData(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return toast('That file is not valid JSON.', true); }
  const list = Array.isArray(d.tournaments) ? d.tournaments : (d && d.teams && d.stages ? [d] : null);
  if (!list) return toast('Not a Matchday export.', true);
  list.forEach(t => { t.id = uid('tn'); S.db.tournaments.push(t); try { recompute(t); } catch (e) { } });
  save(); render(); toast('Imported ' + list.length + ' tournament' + (list.length > 1 ? 's' : ''));
}

/* =====================================================================
   VIEWS (1/2): Overview, Teams, Format
   ===================================================================== */
function matchMini(t, m) {
  const s = stageById(t, m.stageId);
  return `<div class="mini" style="cursor:pointer" data-act="mm" data-ids="${m.tieId && s ? s.ties.find(x => x.id === m.tieId).matchIds.join(',') : m.id}">
    <span class="tm" style="justify-content:flex-end;flex:1">${tmCell(t, m.home, '', true)}</span>
    <span class="sc">${isPlayed(m) ? m.hg + ' – ' + m.ag : '<span class="muted">v</span>'}</span>
    <span class="tm" style="flex:1">${tmCell(t, m.away)}</span></div>
    <div class="tiny muted center" style="margin:-4px 0 4px">${esc(s ? s.name : '')} · ${esc(roundTitle(t, s, m))}${m.group ? ' · ' + esc(m.group) : ''}${m.date ? ' · ' + fmtDate(m.date) : ''}</div>`;
}
V.overview = t => {
  const idx = IDX(t); const sm = idx.summary || {};
  const total = t.matches.length, played = t.matches.filter(isPlayed);
  const goals = played.reduce((a, m) => a + m.hg + m.ag, 0);
  const val = validate(t).filter(v => v.lvl !== 'info');
  let h = '';
  if (sm.champion) {
    h += `<div class="champ"><div class="trophy">🏆</div><div style="flex:1"><div class="muted small bold">CHAMPIONS · ${esc(t.name)} ${esc(t.season)}</div><h2>${esc(teamName(t, sm.champion))}</h2><div class="muted">${sm.runnerUp ? 'Runner-up: <b>' + esc(teamName(t, sm.runnerUp)) + '</b>' : ''}${sm.third ? ' · Third: <b>' + esc(teamName(t, sm.third)) + '</b>' : ''}</div></div>${crest(t, sm.champion, 'lg')}</div>`;
  }
  h += `<div class="grid g4 mb"><div class="kpi"><b>${t.teams.length}</b><span>Teams${t.targetTeams ? ' (need ' + t.targetTeams + ')' : ''}</span></div><div class="kpi"><b>${played.length}<small class="muted"> / ${total}</small></b><span>Matches played</span></div><div class="kpi"><b>${goals}</b><span>Goals · ${played.length ? (goals / played.length).toFixed(2) : '0.00'} per match</span></div><div class="kpi"><b>${t.stages.filter(s => idx.info[s.id].status === 'complete').length}<small class="muted"> / ${t.stages.length}</small></b><span>Stages complete</span></div></div>`;
  if (total) h += `<div class="progress mb"><i style="width:${pct(played.length, total)}%"></i></div>`;
  if (val.length) h += `<div class="card"><div class="card-h"><h3>Needs attention</h3><button class="btn sm" data-act="tab" data-tab="format">Open Format</button></div>${val.map(v => `<div class="callout ${v.lvl === 'error' ? 'error' : 'warn'}">${v.lvl === 'error' ? '⛔' : '⚠'} <span>${esc(v.msg)}</span></div>`).join('')}</div>`;
  h += `<div class="card"><h3 class="mb">Stages</h3>` + (t.stages.length ? t.stages.map((s, i) => {
    const info = idx.info[s.id];
    return `<div class="mini"><span class="chip">${i + 1}</span><b style="flex:1">${esc(s.name)} <span class="muted small">· ${esc(STAGE_TYPES[s.type])}</span></b>${info.status === 'pending' ? `<span class="muted small">${esc(info.reason || '')}</span>` : ''}${info.total ? `<span class="muted small">${info.played}/${info.total}</span>` : ''}${statusChip(info)}</div>`;
  }).join('') : '<div class="muted">No stages yet.</div>') + `</div>`;
  const ready = t.matches.filter(m => m.home && m.away);
  const stIdx = id => t.stages.findIndex(s => s.id === id);
  const upcoming = ready.filter(m => !isPlayed(m)).sort((a, b) => (stIdx(a.stageId) - stIdx(b.stageId)) || (a.round - b.round) || ((a.date || '9') < (b.date || '9') ? -1 : 1)).slice(0, 7);
  const latest = ready.filter(isPlayed).sort((a, b) => (stIdx(b.stageId) - stIdx(a.stageId)) || (b.round - a.round) || ((b.date || '') < (a.date || '') ? -1 : 1)).slice(0, 7);
  h += `<div class="grid g2"><div class="card"><h3 class="mb">Next up</h3>${upcoming.length ? upcoming.map(m => matchMini(t, m)).join('') : '<div class="muted">No fixtures waiting.</div>'}</div>
  <div class="card"><h3 class="mb">Latest results</h3>${latest.length ? latest.map(m => matchMini(t, m)).join('') : '<div class="muted">No results yet — enter scores in Fixtures & Results.</div>'}</div></div>`;
  const ps = playerStats(t).filter(p => p.goals > 0).sort((a, b) => b.goals - a.goals || a.pens - b.pens || b.assists - a.assists).slice(0, 5);
  if (ps.length) h += `<div class="card"><div class="card-h"><h3>Top scorers</h3><button class="btn sm" data-act="tab" data-tab="stats">All stats</button></div>${ps.map((p, i) => `<div class="mini"><span class="muted" style="width:20px">${i + 1}</span>${tmCell(t, p.team, '')}<b style="flex:1">${esc(p.player)}</b><b class="tabnum">${p.goals}</b></div>`).join('')}</div>`;
  return h;
};

/* ---------------- TEAMS ---------------- */
V.teams = t => {
  const n = t.teams.length, tg = t.targetTeams; const s0 = t.stages[0];
  let h = `<div class="card"><div class="card-h"><h2>Teams</h2><span class="chip ${tg ? (n === tg ? 'ok' : 'err') : ''}">${n}${tg ? ' / ' + tg + ' needed' : ''}</span>
    <button class="btn sm primary" data-act="tmadd">＋ Add team</button><button class="btn sm" data-act="tmbulk">Bulk add…</button><button class="btn sm" data-act="tmsample">Sample teams…</button>
    ${tg && n < tg ? `<button class="btn sm" data-act="tmfill">Fill to ${tg}</button>` : ''}<button class="btn sm" data-act="tmsort">Sort A–Z</button><button class="btn sm" data-act="tmshuffle">Shuffle order</button><button class="btn sm" data-act="tmpots">Auto-assign pots</button></div>
    <div class="hint mb">The order of this list is the <b>seeding</b>: it decides byes, bracket positions and (unless you set pots) which pot a team falls in. Pots are optional — group and league-phase draws give each group one team from every pot.</div>`;
  if (s0 && !s0.generated && n >= 2) h += `<div class="callout warn">⚠ <span>Fixtures aren’t generated yet. Go to <b>Format</b> and press <b>Generate fixtures</b>.</span></div>`;
  if (s0 && IDX(t).info[s0.id].stale) h += `<div class="callout warn">⚠ <span>The team list no longer matches the generated fixtures (results exist). Regenerate from Format if you want to start over.</span></div>`;
  if (!n) h += emptyBox('👕', 'No teams yet', 'Add teams one by one, paste a list with “Bulk add”, or load sample teams.');
  else h += `<div class="tw"><table class="tbl"><thead><tr><th>Seed</th><th></th><th class="l">Name</th><th>Short</th><th>Colour</th><th>Pot</th><th>Squad</th><th></th></tr></thead><tbody>` +
    t.teams.map((tm, i) => `<tr><td class="n bold">${i + 1}</td><td>${crest(t, tm.id)}</td>
      <td class="l"><input type="text" data-chg="tm" data-id="${tm.id}" data-k="name" value="${esc(tm.name)}" style="min-width:160px"></td>
      <td><input type="text" data-chg="tm" data-id="${tm.id}" data-k="short" value="${esc(tm.short)}" maxlength="4" style="width:64px;text-align:center"></td>
      <td><input type="color" data-chg="tm" data-id="${tm.id}" data-k="color" value="${esc(tm.color)}"></td>
      <td><input type="number" min="0" max="12" data-chg="tm" data-id="${tm.id}" data-k="pot" value="${tm.pot || ''}" placeholder="–" style="width:62px;text-align:center"></td>
      <td><button class="btn sm" data-act="tmplayers" data-id="${tm.id}">${tm.players.length} players</button></td>
      <td style="white-space:nowrap"><button class="btn sm icon" data-act="tmup" data-id="${tm.id}" ${i === 0 ? 'disabled' : ''}>↑</button> <button class="btn sm icon" data-act="tmdn" data-id="${tm.id}" ${i === n - 1 ? 'disabled' : ''}>↓</button> <button class="btn sm icon danger" data-act="tmdel" data-id="${tm.id}">✕</button></td></tr>`).join('') + `</tbody></table></div>`;
  return h + `</div>`;
};
CHG.tm = el => {
  const id = el.dataset.id, k = el.dataset.k;
  mutate(t => {
    const tm = t.teams.find(x => x.id === id); if (!tm) return;
    if (k === 'name') { const v = el.value.trim(); if (v) { const auto = tm.short === shortOf(tm.name); tm.name = v; if (auto) tm.short = shortOf(v); } }
    else if (k === 'short') tm.short = el.value.trim().toUpperCase().slice(0, 4) || shortOf(tm.name);
    else if (k === 'pot') tm.pot = Math.max(0, parseInt(el.value) || 0);
    else tm[k] = el.value;
  });
};
A.tmadd = () => mutate(t => { let k = t.teams.length + 1; while (t.teams.some(x => x.name === 'Team ' + k)) k++; t.teams.push(newTeam('Team ' + k, { short: 'T' + String(k).padStart(2, '0') })); });
A.tmfill = () => mutate(t => { let k = 1; while (t.teams.length < t.targetTeams) { while (t.teams.some(x => x.name === 'Team ' + k)) k++; t.teams.push(newTeam('Team ' + k, { short: 'T' + String(k).padStart(2, '0') })); } });
A.tmdel = el => {
  const t = cur(); const tm = t.teams.find(x => x.id === el.dataset.id); const s0 = t.stages[0];
  const go = () => mutate(t => { t.teams = t.teams.filter(x => x.id !== tm.id); });
  if (s0 && s0.generated && stageHasResults(t, s0)) ask('Remove ' + tm.name + '? Fixtures already have results, so the stage will be flagged out of date.', go, null, { label: 'Remove' }); else go();
};
A.tmup = el => mutate(t => { const i = t.teams.findIndex(x => x.id === el.dataset.id); if (i > 0) [t.teams[i - 1], t.teams[i]] = [t.teams[i], t.teams[i - 1]]; });
A.tmdn = el => mutate(t => { const i = t.teams.findIndex(x => x.id === el.dataset.id); if (i < t.teams.length - 1) [t.teams[i + 1], t.teams[i]] = [t.teams[i], t.teams[i + 1]]; });
A.tmsort = () => mutate(t => t.teams.sort((a, b) => a.name.localeCompare(b.name)));
A.tmshuffle = () => mutate(t => { t.teams = shuffle(t.teams, Math.random); });
A.tmpots = () => {
  const t = cur(); const s0 = t.stages[0]; let per = 4;
  if (s0 && s0.type === 'groups') per = Math.max(1, s0.numGroups | 0); else if (s0 && s0.type === 'swiss') per = Math.ceil(t.teams.length / Math.max(1, s0.numPots | 0));
  mutate(t => t.teams.forEach((tm, i) => tm.pot = Math.floor(i / per) + 1));
  toast('Pots assigned in seed order (' + per + ' teams per pot)');
};
A.tmbulk = () => openModal({ kind: 'bulk', text: '', replace: false });
A.tmsample = () => openModal({ kind: 'sample', key: 'national', count: cur().targetTeams || cur().teams.length || 16, replace: true });
A.tmplayers = el => { const tm = teamById(cur(), el.dataset.id); openModal({ kind: 'players', id: tm.id, text: tm.players.join('\n') }); };
CHG.mtxt = el => { if (S.modal) S.modal[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; };
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.chg === 'mtxt' && S.modal) S.modal[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; });
A.bulksave = () => {
  const m = S.modal; const lines = m.text.split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) return toast('Nothing to add', true);
  A.closemodal();
  mutate(t => {
    if (m.replace) t.teams = [];
    lines.forEach(l => { const [name, short, color] = l.split(/[,;\t]/).map(x => x.trim()); if (!name) return; if (t.teams.some(x => x.name.toLowerCase() === name.toLowerCase())) return; t.teams.push(newTeam(name, { short: short && short.length <= 4 ? short : undefined, color: /^#[0-9a-f]{6}$/i.test(color || '') ? color : undefined })); });
  });
};
A.samplesave = () => {
  const m = S.modal; A.closemodal();
  mutate(t => { const list = sampleTeams(m.key, Math.max(1, parseInt(m.count) || 1)); if (m.replace) t.teams = list; else list.forEach(x => { if (!t.teams.some(y => y.name === x.name)) t.teams.push(x); }); });
};
A.playersave = () => {
  const m = S.modal; A.closemodal();
  mutate(t => { const tm = t.teams.find(x => x.id === m.id); tm.players = [...new Set(m.text.split('\n').map(x => x.trim()).filter(Boolean))]; });
};

/* ---------------- FORMAT ---------------- */
const cfgIn = (s, k, o = {}) => `<input type="${o.type || 'number'}" data-chg="cfg" data-sid="${s.id}" data-k="${k}" data-t="${o.t || 'int'}" ${o.struct ? 'data-s="1"' : ''} value="${esc(k.includes('.') ? k.split('.').reduce((a, b) => a[b], s) : s[k])}" ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}>`;
const cfgSel = (s, k, opts, o = {}) => `<select data-chg="cfg" data-sid="${s.id}" data-k="${k}" data-t="${o.t || 'str'}" ${o.struct ? 'data-s="1"' : ''}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(s[k]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const cfgChk = (s, k, label, o = {}) => `<label class="fld chk"><input type="checkbox" data-chg="cfg" data-sid="${s.id}" data-k="${k}" data-t="bool" ${o.struct ? 'data-s="1"' : ''} ${s[k] ? 'checked' : ''}><span>${label}</span></label>`;
const fld = (label, inner, cls = '') => `<label class="fld ${cls}"><span>${label}</span>${inner}</label>`;
CHG.cfg = el => {
  const sid = el.dataset.sid, k = el.dataset.k, ty = el.dataset.t, struct = el.dataset.s === '1';
  let v = el.value;
  if (ty === 'bool') v = el.checked; else if (ty === 'int') v = Math.max(parseInt(el.min) || 0, parseInt(v) || 0); else if (ty === 'float') v = parseFloat(v) || 0;
  if (ty === 'int' && el.max) v = Math.min(parseInt(el.max), v);
  const t = cur(); const s0 = getStage(t, sid);
  const apply = () => mutate(t => {
    const s = getStage(t, sid); const path = k.split('.'); let o = s; while (path.length > 1) o = o[path.shift()]; o[path[0]] = v;
    if (struct && s.generated) regenStage(t, s);
    else if (struct && s.type === 'knockout') s.manualSlots = null;
  });
  if (struct && s0.generated && stageHasResults(t, s0)) ask('Changing this rebuilds the stage’s fixtures and deletes its results. Continue?', apply, () => render(), { label: 'Rebuild & continue' }); else apply();
};
CHG.tinfo = el => { const k = el.dataset.k; mutate(t => { if (k === 'targetTeams') t.targetTeams = parseInt(el.value) > 1 ? parseInt(el.value) : null; else t[k] = el.value; }); };

const SRC_KINDS = {
  league: [['rank', 'Table positions'], ['all', 'All teams']], swiss: [['rank', 'Table positions'], ['all', 'All teams']],
  groups: [['groupPos', 'Top N of every group'], ['bestOfPos', 'Best N-th placed teams'], ['rank', 'Overall ranking positions']],
  knockout: [['koWinners', 'Winners'], ['koLosers', 'Losers']]
};
function srcRow(t, s, j, src, i) {
  const prev = t.stages.slice(0, i); const st = t.stages.find(x => x.id === src.stage) || prev[prev.length - 1];
  const kinds = SRC_KINDS[st ? st.type : 'league'];
  const num = (f, w, min = 1) => `<input type="number" min="${min}" data-chg="src" data-sid="${s.id}" data-j="${j}" data-f="${f}" value="${src[f] != null ? src[f] : ''}" style="width:${w || 64}px">`;
  let p = '';
  if (src.kind === 'rank') p = `from ${num('from')} to ${num('to')}`;
  else if (src.kind === 'groupPos') p = `top ${num('perGroup')} per group`;
  else if (src.kind === 'bestOfPos') p = `position ${num('pos')} · best ${num('count')}`;
  return `<div class="srcrow"><span class="muted small">From</span><select data-chg="src" data-sid="${s.id}" data-j="${j}" data-f="stage">${prev.map(x => `<option value="${x.id}" ${x.id === src.stage ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
  <select data-chg="src" data-sid="${s.id}" data-j="${j}" data-f="kind">${kinds.map(([v, l]) => `<option value="${v}" ${src.kind === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${p}<button class="btn sm icon danger" data-act="srcdel" data-sid="${s.id}" data-j="${j}">✕</button></div>`;
}
function defaultSource(t, i) {
  const p = t.stages[i - 1]; if (!p) return null;
  if (p.type === 'groups') return { stage: p.id, kind: 'groupPos', perGroup: 2 };
  if (p.type === 'knockout') return { stage: p.id, kind: 'koWinners' };
  return { stage: p.id, kind: 'rank', from: 1, to: 8 };
}
CHG.src = el => {
  const sid = el.dataset.sid, j = +el.dataset.j, f = el.dataset.f; const t = cur(); const s0 = getStage(t, sid);
  const apply = () => mutate(t => {
    const s = getStage(t, sid); const src = s.sources[j];
    if (f === 'stage') { src.stage = el.value; const st = getStage(t, el.value); const kinds = SRC_KINDS[st.type].map(x => x[0]); if (!kinds.includes(src.kind)) { Object.keys(src).forEach(k => { if (k !== 'stage') delete src[k]; }); setKind(src, kinds[0]); } }
    else if (f === 'kind') { Object.keys(src).forEach(k => { if (k !== 'stage') delete src[k]; }); setKind(src, el.value); }
    else src[f] = Math.max(1, parseInt(el.value) || 1);
    if (s.generated) regenStage(t, s);
  });
  if (s0.generated && stageHasResults(t, s0)) ask('Changing qualification rebuilds this stage and deletes its results. Continue?', apply, () => render(), { label: 'Rebuild & continue' }); else apply();
};

A.stadd = el => mutate(t => {

    [t.stages[i], t.stages[j]] = [t.stages[j], t.stages[i]];

  return h;
};

    if (hs === '') { res.hg = null; res.ag = null; res.pen = null; res.aet = false; }
    else {
      res.hg = Math.max(0, parseInt(hs) || 0); res.ag = Math.max(0, parseInt(as) || 0);
      const ph = String(it.penH).trim(), pa = String(it.penA).trim();
      if ((ph === '') !== (pa === '')) return toast('Enter both penalty scores, or neither.', true);
      if (ph !== '') {
        const multiLast = tieId && mm.items.length > 1 && it === mm.items[mm.items.length - 1];
        if (res.hg !== res.ag && !multiLast) return toast('Penalties only apply when the match score is level.', true);
        const a = Math.max(0, parseInt(ph) || 0), b = Math.max(0, parseInt(pa) || 0);
        if (a === b) return toast('A shoot-out cannot end level.', true);
        res.pen = { h: a, a: b };
      } else res.pen = null;
    }
    res.events = it.events.filter(e => e.team).map(e => ({ type: e.type, team: e.team, player: String(e.player || '').trim(), assist: (e.type === 'goal' || e.type === 'pen') ? String(e.assist || '').trim() : '', minute: e.minute === '' || e.minute == null ? null : Math.max(0, parseInt(e.minute) || 0) }));
    res.events.sort((x, y) => (x.minute == null ? 999 : x.minute) - (y.minute == null ? 999 : y.minute));
    out.push(res);
  }
  const ov = mm.override;
  A.closemodal();
  mutate(t => {
    out.forEach(r => {
      const m = t.matches.find(x => x.id === r.id);
      Object.assign(m, { hg: r.hg, ag: r.ag, pen: r.pen, aet: r.aet, date: r.date, time: r.time, venue: r.venue, notes: r.notes, events: r.events });
      r.events.forEach(e => { const tm = t.teams.find(x => x.id === e.team); if (!tm) return;[e.player, e.assist].forEach(nm => { if (nm && !tm.players.some(p => p.toLowerCase() === nm.toLowerCase())) tm.players.push(nm); }); });
    });
    if (tieId) { const s = t.stages.find(x => x.ties.some(y => y.id === tieId)); const tie = s.ties.find(x => x.id === tieId); tie.override = ov || null; }
  });
  const t2 = cur(); if (tieId) { const r = IDX(t2).tieRes.get(tieId); if (r && r.state === 'level') toast('Still level on aggregate — enter penalties or pick a winner.', true); }
  const sc = out.find(r => r.events.length && r.hg != null); if (sc) { const g = eventGoals(Object.assign({}, IDX(t2).m.get(sc.id))); const m = IDX(t2).m.get(sc.id); if (g.h !== m.hg || g.a !== m.ag) toast('Saved — note the listed goals (' + g.h + '–' + g.a + ') don’t match the score (' + m.hg + '–' + m.ag + ').'); }
};

/* boot */
load();
$('file').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(f); ev.target.value = ''; });
render();

</script>
</body>
